<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio home page</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/storage.js"></script>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!--NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand" href="index.html"
          ><h3><b>Portfolio Builder</b></h3></a
        >

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="create-portfolio.html"
                >Create Portfolio</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="add-item.html">Add Item</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="portfolio.html"
                >View Portfolio</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <!-- MAIN CONTENT -->
<main class="container py-5">

    <!-- PROFILE HEADER -->
<section class="mb-5">
    <div class="d-flex align-items-center gap-4">

        <div id="profile-avatar"
             class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
             style="width: 110px; height: 110px; font-size: 36px;">
            ?
        </div>

        <div>
            <h1 class="fw-bold" id="profile-name">Loading...</h1>
            <p class="text-muted" id="profile-welcome">
                Welcome to my personal portfolio!
            </p>
        </div>

    </div>
</section>

    <!-- INTERESTS -->
    <section class="row g-3">

    <div class="col-md-4">
        <div class="card h-100 p-3">
            <h2 class="h5">What I Enjoy</h2>
            <div id="enjoy-list">Loading...</div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card h-100 p-3">
            <h2 class="h5">What I Tried</h2>
            <div id="tried-list">Loading...</div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card h-100 p-3">
            <h2 class="h5">What I'm Curious About</h2>
            <div id="curious-list">Loading...</div>
        </div>
    </div>

</section>
    <!-- PORTFOLIO ITEMS -->
<section class="mt-5 mb-5">
    <h2 class="fw-bold mb-4">My Portfolio Items</h2>

    <div id="portfolio-items" class="row g-4">
        <!-- Items will be generated by render.js -->
    </div>
</section>
</section>

</main>


    <!-- FOOTER -->
    <footer class="bg-dark text-light text-center py-3 mt-auto">
      <small>&copy; 2026 Portfolio Builder | CS100 group 20</small>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/render.js"></script>
    <script src="js/sample-data.js"></script>
    <script src="js/data-tools.js"></script>
  </body>
</html>
